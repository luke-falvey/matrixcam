name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: matrixcam-windows-x64, bin: matrixcam.exe }
          - { os: macos-latest,   name: matrixcam-macos-arm64, bin: matrixcam }
          - { os: ubuntu-22.04,   name: matrixcam-linux-x64,   bin: matrixcam }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libclang-dev
      - run: cargo build --release --locked
      - run: ./target/release/${{ matrix.bin }} --help
        shell: bash
      - name: Render a test frame
        shell: bash
        run: ./target/release/${{ matrix.bin }} --image tests/face.jpg --snapshot rendered.png
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.bin }}

      # End-to-end check of the Windows virtual camera: start matrixcam feeding
      # the camera, then read frames back from it like Teams would. Hosted
      # runners are servers without a camera stack guarantee, so this reports
      # rather than gates.
      - name: Virtual camera smoke test
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "target\release\matrixcam.exe"
          & $exe --install-driver
          "install exit code: $LASTEXITCODE"
          New-Item -ItemType File -Force "$env:ProgramData\matrixcam\debug" | Out-Null
          Get-Service FrameServer, FrameServerMonitor -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, BuildNumber | Out-String).Trim()
          "--- camera privacy settings before ---"
          $consent = "SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\webcam"
          reg query "HKLM\$consent" /v Value 2>&1
          reg query "HKCU\$consent" /v Value 2>&1
          reg query "HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy" 2>&1
          reg add "HKLM\$consent" /v Value /d Allow /f | Out-Null
          reg add "HKCU\$consent" /v Value /d Allow /f | Out-Null
          reg add "HKCU\$consent\NonPackaged" /v Value /d Allow /f | Out-Null
          icacls "$env:ProgramFiles\matrixcam\matrixcam_vcam.dll"
          $feeder = Start-Process $exe -ArgumentList "--image","tests\face.jpg" -PassThru -NoNewWindow `
            -RedirectStandardOutput feeder.out -RedirectStandardError feeder.err
          Start-Sleep 10
          "--- cameras ---"
          & $exe --list-cameras
          "--- read back from the virtual camera ---"
          & $exe --camera 0 --no-virtualcam --snapshot readback.png
          "readback exit code: $LASTEXITCODE"
          Stop-Process -Id $feeder.Id -ErrorAction SilentlyContinue
          "--- feeder output ---"; Get-Content feeder.out, feeder.err -ErrorAction SilentlyContinue
          "--- camera component log ---"; Get-Content "$env:ProgramData\matrixcam\vcam.log" -ErrorAction SilentlyContinue
          Get-Service FrameServer, FrameServerMonitor -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType
          "--- camera related event logs ---"
          Get-WinEvent -ListLog *FrameServer*, *Camera*, *MediaFoundation*, *MF-* -ErrorAction SilentlyContinue |
            Where-Object RecordCount -gt 0 | ForEach-Object {
              "## $($_.LogName) ($($_.RecordCount) records)"
              Get-WinEvent -LogName $_.LogName -MaxEvents 15 -ErrorAction SilentlyContinue |
                ForEach-Object { "$($_.TimeCreated.ToString('HH:mm:ss')) [$($_.Id)] $($_.Message)" }
            }
          Get-WinEvent -FilterHashtable @{LogName='System','Application'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'FrameServer|Frame Server|camera|matrixcam' } |
            ForEach-Object { "$($_.TimeCreated.ToString('HH:mm:ss')) [$($_.ProviderName) $($_.Id)] $($_.Message)" }
          if (!(Test-Path readback.png)) { exit 1 }
      - if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test
          path: |
            rendered.png
            readback.png
          if-no-files-found: ignore
