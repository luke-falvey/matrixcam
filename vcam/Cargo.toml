[package]
name = "matrixcam_vcam"
version = "0.3.0"
edition = "2021"
description = "Media Foundation virtual camera source for matrixcam (Windows 11)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
matrixcam-shared = { path = "../shared" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[workspace]
