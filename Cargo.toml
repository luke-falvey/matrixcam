[package]
name = "matrixcam"
version = "0.2.0"
edition = "2021"
description = "Turn your webcam into Matrix-style digital rain on a virtual camera"
license = "MIT"

[features]
default = ["preview"]
preview = ["dep:minifb"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
minifb = { version = "0.29", optional = true }
nokhwa = { version = "0.10", features = ["input-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = true
strip = true
