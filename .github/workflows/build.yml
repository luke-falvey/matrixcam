name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: matrixcam-windows-x64, bin: matrixcam.exe }
          - { os: macos-latest,   name: matrixcam-macos-arm64, bin: matrixcam }
          - { os: ubuntu-22.04,   name: matrixcam-linux-x64,   bin: matrixcam }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libclang-dev nasm
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: cargo build --release --locked
      - run: ./target/release/${{ matrix.bin }} --help
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
